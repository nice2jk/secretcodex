{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nada 비밀번호 - 쓰잘데기</title>
    <link rel="icon" href="{% static 'board/trash-icon.svg' %}" type="image/svg+xml">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
  </head>
  <body class="bg-light">
    <main class="min-vh-100 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <h1 class="h4 fw-bold mb-4 text-center">Nada</h1>
                <form method="post" novalidate>
                  {% csrf_token %}
                  <input type="hidden" name="next" value="{{ next }}">
                  <div class="mb-3">
                    <label for="nada-password" class="form-label">비밀번호</label>
                    <input
                      id="nada-password"
                      class="form-control"
                      type="password"
                      name="password"
                      autocomplete="current-password"
                      autofocus
                    >
                  </div>
                  <button type="submit" class="btn btn-dark w-100">입장</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    {% if messages %}
      <div class="toast-container position-fixed top-0 end-0 p-3">
        {% for message in messages %}
          <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3500">
            <div class="d-flex">
              <div class="toast-body">{{ message }}</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="닫기"></button>
            </div>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document.querySelectorAll('.toast').forEach(function (toastEl) {
        new bootstrap.Toast(toastEl).show();
      });
    </script>
  </body>
</html>
